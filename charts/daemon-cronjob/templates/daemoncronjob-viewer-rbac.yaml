apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "daemon-cronjob.fullname" . }}-daemoncronjob-viewer-role
  labels:
  {{- include "daemon-cronjob.labels" . | nindent 4 }}
rules:
- apiGroups:
  - scheduling.xzzpig.com
  resources:
  - daemoncronjobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - scheduling.xzzpig.com
  resources:
  - daemoncronjobs/status
  verbs:
  - get
